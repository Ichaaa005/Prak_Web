<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontak Saya</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Formulir Kontak</h1>
    </header>

    <hr>

    <main>
        <section>
            <h2>Kirimkan Pesan atau Penawaran Proyek</h2>
            <form action="">

                <p>
                    <label for="Nama Pengirim">Nama Lengkap Anda:</label>
                    <input type="text" id="nama_pengirim" name="nama_pengirim"
                </p>

                <p>
                    <label for="email_pengirim">Alamat Email:</label>
                    <input type="email" id="email_pengirim" name="email_pengirim"
                </p>

                <p>
                    <label for="jenis_layanan">Layanan yang Dibutuhkan:</label>
                    <select id="jenis_layanan" name="jenis_layanan">
                        <option value="">== Pilih Layanan ==</option>
                        <option value="web">Pembuatan Web</option>
                        <option value="app">Pengembangan Aplikasi</option>
                        <option value="other">Lain-lain</option>
                    </select>
                </p>

                <p>
                    <label for="pesan">Pesan:</label>
                    <textarea name="Pesan" id="pesan" rows="6"></textarea>
                </p>

                <button type="submit">Kirim Pesan</button>
                <button type="reset">Batal / Reset</button>

            </form>
        </section>
    </main>

    <hr>

    <footer>
        <p>&copy; 2026 Teknik Informatika ITG</p>
    </footer>

</body>
</html>
